name: Build site and pubblish to gh pages

on:
  push:
    branch: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        if: ${{ vars.pages-enabled }}
        uses: actions/configure-pages@v5 

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12
          cache: 'npm'

      - name: Run build
        run: |
          npm run ci
          npm run lint
          npm run build

      - name: Upload static files as artifact
        id: deployment
        if: ${{ vars.pages-enabled }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build_outputs_folder/

  deploy:
    if: ${{ vars.pages-enabled }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
